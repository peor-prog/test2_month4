<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ task.title }}</title>
</head>
<body>
    <h1>{{ task.title }}</h1>
    <p><strong>Статус:</strong> {% if task.completed %}Выполнено{% else %}Не выполнено{% endif %}</p>
    <p><strong>Дата создания:</strong> {{ task.created_at }}</p>
    <p><strong>Описание:</strong></p>
    <p>{{ task.description|default:"Описание отсутствует." }}</p>

    <p><a href="{% url 'task_list' %}">Назад к списку</a></p>
</body>
</html>
