<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
</head>
<body>
    <h1>Мои задачи</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Добавить задачу</button>
    </form>

    <hr>

    <ul>
        {% for task in tasks %}
            <li>
                <input type="checkbox" {% if task.completed %}checked{% endif %} 
                       onclick="location.href='{% url 'toggle_task' task.pk %}'">
                
                <a href="{% url 'task_detail' task.pk %}">
                    {% if task.completed %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
                </a>
                <small>({{ task.created_at|date:"d.m.Y H:i" }})</small>
            </li>
        {% empty %}
            <p>Пока нет ни одной задачи.</p>
        {% endfor %}
    </ul>
</body>
</html>
